<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Care Package</title>
    <style>
        :root {
            --bg-window: #FDFBF7;
            --text-dark: #4A3B32;
            --border-retro: #D1C7BD;
        }
        body {
            /* Le ciel pixel art en fond */
            background: #87CEEB url('https://i.pinimg.com/originals/81/29/7c/81297cc8c9c99d2568b209d0eb61e9dc.gif') center/cover fixed;
            font-family: 'Courier New', Courier, monospace;
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* La fenêtre principale style vieux Mac/Windows */
        .window-container {
            background: var(--bg-window);
            border: 2px solid var(--border-retro);
            border-radius: 12px;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        /* Barre supérieure de la fenêtre */
        .window-container::before {
            content: "•••";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 30px;
            background: var(--border-retro);
            border-radius: 10px 10px 0 0;
            color: white;
            font-size: 24px;
            line-height: 30px;
            text-align: left;
            padding-left: 15px;
            letter-spacing: 2px;
        }

        h2, .box-title {
            font-family: 'Georgia', serif;
            font-size: 24px;
            margin-top: 10px;
            color: #8B3A3A;
            font-style: italic;
        }

        /* --- STYLES ATELIER --- */
        .input-group { margin-bottom: 20px; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-retro);
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
            background: #fff;
        }
        
        button {
            background-color: var(--bg-window);
            color: var(--text-dark);
            border: 2px solid var(--text-dark);
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover { background-color: var(--text-dark); color: var(--bg-window); }

        /* --- STYLES COLIS (RECEPTION) --- */
        #package { display: none; } /* Caché par défaut */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-top: 30px;
        }
        .item {
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .item:hover {
            transform: translateY(-5px) scale(1.05);
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.1));
        }
        .item img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .item-label {
            font-size: 14px;
            background: rgba(209, 199, 189, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* --- POP-UP --- */
        #modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg-window);
            padding: 40px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            border: 2px solid var(--border-retro);
        }
        .close-btn {
            position: absolute; top: 10px; right: 15px; font-size: 24px;
            cursor: pointer; color: var(--text-dark);
        }
        .typewriter-text { white-space: pre-wrap; text-align: left; }
    </style>
</head>
<body>

    <!-- FENÊTRE PRINCIPALE -->
    <div class="window-container">
        
        <!-- 1. ATELIER DE CRÉATION (Visible pour toi) -->
        <div id="atelier">
            <h2>Ton Atelier Secret</h2>
            <div class="input-group">
                <label>1. Ta lettre</label>
                <textarea id="letter-input" rows="4" placeholder="Tape ton mot doux ici..."></textarea>
            </div>
            <div class="input-group">
                <label>2. Lien d'une musique (Spotify/Deezer)</label>
                <input type="text" id="music-input" placeholder="https://...">
            </div>
            <button onclick="sealPackage()">Sceller le colis ✨</button>
            <p id="link-output" style="word-wrap: break-word; font-size: 12px; margin-top: 20px; font-weight: bold;"></p>
        </div>

        <!-- 2. VUE DU COLIS (Visible pour ton ami) -->
        <div id="package">
            <img src="https://cdn-icons-png.flaticon.com/512/3258/3258525.png" alt="Cardboard Box" style="width: 120px; opacity: 0.9;">
            <div class="box-title">you've got mail...</div>
            
            <div class="grid">
                <div class="item" onclick="openModal('letter')">
                    <!-- Remplace par l'image de ta machine à écrire -->
                    <img src="https://cdn-icons-png.flaticon.com/512/3063/3063205.png" alt="Typewriter">
                    <div class="item-label">note</div>
                </div>
                <div class="item" onclick="openModal('music')">
                    <!-- Remplace par l'image de ton MP3 Apple -->
                    <img src="https://cdn-icons-png.flaticon.com/512/17/17791.png" alt="MP3 Player">
                    <div class="item-label">song</div>
                </div>
            </div>
        </div>
        
    </div>

    <!-- 3. FENÊTRE POP-UP (S'ouvre au clic sur un objet) -->
    <div id="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- LE MOTEUR DU SITE -->
    <script>
        let packageData = {};
        
        // Vérifie si on est dans l'atelier ou si on reçoit un colis
        const urlParams = new URLSearchParams(window.location.search);
        const boxCode = urlParams.get('box');

        if (boxCode) {
            // C'est ton ami qui ouvre le lien : on cache l'atelier, on montre le colis
            document.getElementById('atelier').style.display = 'none';
            document.getElementById('package').style.display = 'block';
            
            try {
                // Décodage du secret
                packageData = JSON.parse(decodeURIComponent(escape(atob(boxCode))));
            } catch (e) {
                document.getElementById('package').innerHTML = "<h2>Le colis est abîmé (lien invalide).</h2>";
            }
        }

        // Fonction pour créer le lien secret
        function sealPackage() {
            const data = {
                letter: document.getElementById('letter-input').value,
                music: document.getElementById('music-input').value
            };
            // Transformation en lien
            const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
            const url = window.location.origin + window.location.pathname + "?box=" + encoded;
            
            // Affichage du lien
            document.getElementById('link-output').innerHTML = `Copie ce lien et envoie-le :<br><br><a href="${url}" style="color:#8B3A3A;">${url}</a>`;
        }

        // Fonctions pour le Pop-up
        function openModal(type) {
            const body = document.getElementById('modal-body');
            if (type === 'letter') {
                body.innerHTML = `<div class="typewriter-text">${packageData.letter || 'Rien d\'écrit...'}</div>`;
            } else if (type === 'music') {
                body.innerHTML = `🎵<br><br><a href="${packageData.music}" target="_blank" style="color:#8B3A3A; font-weight:bold; text-decoration:none;">Lancer la piste audio</a>`;
            }
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { 
            document.getElementById('modal').style.display = 'none'; 
        }
    </script>
</body>
</html>
