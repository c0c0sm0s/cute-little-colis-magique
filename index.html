<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Care Package</title>
    <style>
        :root {
            --bg-window: #FDFBF7; /* Crème très clair */
            --text-dark: #4A3B32; /* Marron foncé vintage */
            --border-retro: #D1C7BD;
        }
        body {
            /* Ciel en pixel art animé (Image temporaire pour l'ambiance) */
            background: #87CEEB url('https://i.pinimg.com/originals/81/29/7c/81297cc8c9c99d2568b209d0eb61e9dc.gif') center/cover fixed;
            font-family: 'Times New Roman', serif;
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* La fenêtre principale style vieux Mac/Windows */
        .window-container {
            background: var(--bg-window);
            border: 2px solid var(--border-retro);
            border-radius: 12px;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.15); /* Ombre dure rétro */
            padding: 40px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        /* Barre supérieure de la fenêtre */
        .window-container::before {
            content: "•••";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 30px;
            background: var(--border-retro);
            border-radius: 10px 10px 0 0;
            color: white;
            font-size: 24px;
            line-height: 30px;
            text-align: left;
            padding-left: 15px;
            letter-spacing: 2px;
        }

        .box-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: 28px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 40px;
            color: #8B3A3A; /* Rouge bordeaux doux */
        }

        /* Grille des objets réels */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin-top: 30px;
        }

        .item {
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .item:hover {
            transform: translateY(-5px) scale(1.05);
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.2));
        }

        /* Emplacement pour tes vraies images détourées */
        .item img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 12px;
            /* Si l'image n'est pas encore chargée, on met un fond gris doux */
            background-color: transparent; 
        }

        .item-label {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            letter-spacing: 1px;
            color: var(--text-dark);
            background: rgba(209, 199, 189, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Masquer l'atelier par défaut pour voir l'esthétique du colis */
        #atelier { display: none; }
        
        /* Boutons rétro */
        button {
            background: transparent;
            border: 2px solid var(--text-dark);
            color: var(--text-dark);
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }
        button:hover {
            background: var(--text-dark);
            color: var(--bg-window);
        }
    </style>
</head>
<body>

    <div class="window-container" id="package">
        <!-- L'image de ta boîte en carton fermée ira ici -->
        <img src="https://cdn-icons-png.flaticon.com/512/3258/3258525.png" alt="Cardboard Box" style="width: 150px; margin-bottom: 20px; opacity: 0.8;">
        
        <div class="box-title">you've got mail...</div>
        
        <div class="grid">
            <!-- Objet 1 : Machine à écrire -->
            <div class="item">
                <!-- Remplace le lien 'src' par TA photo de machine à écrire -->
                <img src="https://cdn-icons-png.flaticon.com/512/3063/3063205.png" alt="Typewriter">
                <div class="item-label">note</div>
            </div>

            <!-- Objet 2 : iPod / MP3 -->
            <div class="item">
                <!-- Remplace le lien 'src' par TA photo d'iPod -->
                <img src="https://cdn-icons-png.flaticon.com/512/17/17791.png" alt="MP3 Player">
                <div class="item-label">song</div>
            </div>

            <!-- Objet 3 : Polaroïd -->
            <div class="item">
                <!-- Remplace le lien 'src' par TA photo de Polaroïd -->
                <img src="https://cdn-icons-png.flaticon.com/512/3342/3342137.png" alt="Polaroid">
                <div class="item-label">photo</div>
            </div>
        </div>
    </div>

</body>
</html>
